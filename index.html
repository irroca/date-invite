<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Qixi · cc</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --text: #fff6ee;
    --muted: #d2c4b8;
    --rose: #ff8aa0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: "Noto Sans SC", "PingFang SC", sans-serif;
    color: var(--text);
    background: #0b0610;
  }

  canvas#sky, canvas#bokeh, canvas#fireworks {
    position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none;
  }
  canvas#sky { z-index: 0; }
  canvas#bokeh { z-index: 1; }
  canvas#fireworks { z-index: 6; }

  .wash {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 55% at 50% 100%, rgba(255, 90, 120, 0.22), transparent 55%),
      radial-gradient(ellipse 50% 40% at 85% 10%, rgba(255, 150, 170, 0.16), transparent 50%),
      radial-gradient(ellipse 40% 35% at 10% 20%, rgba(130, 80, 180, 0.16), transparent 50%);
  }
  .vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(6, 3, 8, 0.72) 100%);
  }
  .grain {
    position: fixed; inset: 0; z-index: 7; pointer-events: none; opacity: .08;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .petals { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .petal {
    position: absolute; top: -8%;
    width: 10px; height: 14px;
    background: radial-gradient(circle at 30% 30%, #ffd0d8, #ff7d96 70%);
    border-radius: 70% 10% 70% 10%;
    opacity: .55;
    animation: fall linear infinite;
    filter: blur(.2px);
  }
  @keyframes fall {
    0% { transform: translate3d(0,-10vh,0) rotate(0deg); opacity: 0; }
    12% { opacity: .6; }
    100% { transform: translate3d(40px, 110vh, 0) rotate(360deg); opacity: 0; }
  }

  .stage {
    position: relative; z-index: 4;
    height: 100dvh; width: 100%;
    perspective: 1600px;
  }

  .page {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 48px 28px 80px;
    text-align: center;
    opacity: 0;
    transform: translate3d(40px, 0, 0) scale(.96);
    pointer-events: none;
    transition: opacity .7s ease, transform .8s cubic-bezier(.22,.7,.2,1);
  }
  .page.done {
    opacity: 0;
    transform: translate3d(-50px, 0, 0) scale(.96);
  }
  .page.now {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }

  .script {
    font-family: "Great Vibes", cursive;
    font-size: clamp(34px, 8vw, 52px);
    color: #ffd4dc;
    margin: 0 0 8px;
    text-shadow: 0 8px 30px rgba(255, 120, 140, 0.35);
  }
  .rule {
    width: 72px; height: 1px; margin: 16px 0 22px;
    background: linear-gradient(90deg, transparent, #ffb3c0, transparent);
  }
  h1, .line {
    font-family: "Cormorant Garamond", "Noto Sans SC", serif;
    font-weight: 550;
    font-size: clamp(30px, 8vw, 46px);
    letter-spacing: 0.08em;
    line-height: 1.45;
    margin: 0;
    text-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  .soft {
    margin: 18px 0 0;
    max-width: 16em;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.9;
    letter-spacing: 0.06em;
  }
  .chip {
    letter-spacing: 0.28em;
    font-size: 12px;
    color: #e7c8ce;
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  .dots {
    position: fixed; z-index: 8; left: 50%; bottom: 22px;
    transform: translateX(-50%);
    display: flex; gap: 8px;
  }
  .dots b {
    width: 6px; height: 6px; border-radius: 99px;
    background: rgba(255,255,255,.25);
    transition: width .25s ease, background .25s ease;
  }
  .dots b.on { width: 20px; background: var(--rose); }

  .nav {
    position: fixed; z-index: 8; inset: 0;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; padding: 0 10px;
  }
  .nav button {
    pointer-events: auto;
    width: 42px; height: 42px; border: 0; border-radius: 50%;
    background: rgba(255,255,255,.08); color: #fff;
    font-size: 20px; cursor: pointer;
    backdrop-filter: blur(8px);
  }
  .nav button[disabled] { opacity: .15; }

  .hint {
    position: absolute; bottom: 56px;
    color: rgba(226, 206, 198, 0.55);
    font-size: 12px; letter-spacing: 0.18em;
  }

  @media (prefers-reduced-motion: reduce) {
    .page { transition: none; }
    .petal { animation: none; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="bokeh"></canvas>
<canvas id="fireworks"></canvas>
<div class="wash"></div>
<div class="vignette"></div>
<div class="grain"></div>
<div class="petals" id="petals"></div>

<div class="stage" id="stage">
  <article class="page now">
    <p class="chip">Qixi · 08.19</p>
    <p class="script">for cc</p>
    <div class="rule"></div>
    <h1>今晚想把夜色<br>留给你</h1>
    <p class="hint">向左滑</p>
  </article>

  <article class="page">
    <p class="script">tonight</p>
    <div class="rule"></div>
    <p class="line">晚风经过的时候</p>
    <p class="soft">我都当它是来找你的。</p>
  </article>

  <article class="page">
    <p class="script">always</p>
    <div class="rule"></div>
    <p class="line">喜欢你这件事</p>
    <p class="soft">是这一年里，最安静也最亮的光。</p>
  </article>

  <article class="page">
    <p class="script">us</p>
    <div class="rule"></div>
    <p class="line">并肩走过的路</p>
    <p class="soft">不必盛大，也已经足够浪漫。</p>
  </article>

  <article class="page">
    <p class="script">forever</p>
    <div class="rule"></div>
    <p class="line">七夕快乐，cc</p>
    <p class="soft">余生慢慢走，我都在。</p>
  </article>
</div>

<div class="nav">
  <button id="prev" type="button" aria-label="上一页">‹</button>
  <button id="next" type="button" aria-label="下一页">›</button>
</div>
<div class="dots" id="dots"></div>

<script>
const pages = [...document.querySelectorAll(".page")];
const dots = document.getElementById("dots");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
let i = 0, lock = false;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

pages.forEach((_, n) => {
  const b = document.createElement("b");
  if (!n) b.className = "on";
  dots.appendChild(b);
});

function go(n) {
  if (lock || n === i || n < 0 || n >= pages.length) return;
  lock = true;
  const dir = n > i ? 1 : -1;
  pages[i].classList.remove("now");
  pages[i].classList.toggle("done", dir > 0);
  i = n;
  pages[i].classList.remove("done");
  pages[i].classList.add("now");
  dots.querySelectorAll("b").forEach((d, k) => d.classList.toggle("on", k === i));
  prev.disabled = i === 0;
  next.disabled = i === pages.length - 1;
  celebrate(i === pages.length - 1 ? 4 : 2);
  setTimeout(() => { lock = false; }, reduced ? 0 : 700);
}
prev.onclick = () => go(i - 1);
next.onclick = () => go(i + 1);
prev.disabled = true;

let x0 = null;
addEventListener("touchstart", e => { x0 = e.changedTouches[0].clientX; }, { passive: true });
addEventListener("touchend", e => {
  if (x0 == null) return;
  const dx = e.changedTouches[0].clientX - x0;
  x0 = null;
  if (Math.abs(dx) < 40) return;
  go(dx < 0 ? i + 1 : i - 1);
});
addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") go(i + 1);
  if (e.key === "ArrowLeft") go(i - 1);
});

(function petals() {
  const box = document.getElementById("petals");
  for (let k = 0; k < 16; k++) {
    const p = document.createElement("i");
    p.className = "petal";
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDuration = 9 + Math.random() * 10 + "s";
    p.style.animationDelay = -Math.random() * 12 + "s";
    p.style.transform = "scale(" + (0.6 + Math.random() * 0.9) + ")";
    box.appendChild(p);
  }
})();

function fit(cvs) {
  const ctx = cvs.getContext("2d");
  cvs.width = innerWidth * devicePixelRatio;
  cvs.height = innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  return ctx;
}

(function sky() {
  const ctx = fit(document.getElementById("sky"));
  const stars = [];
  const n = Math.min(90, Math.floor(innerWidth * 0.09));
  for (let k = 0; k < n; k++) stars.push({
    x: Math.random(), y: Math.random() * 0.85,
    r: Math.random() * 1.2 + 0.25, a: 0.15 + Math.random() * 0.55,
    p: Math.random() * Math.PI * 2, s: 0.35 + Math.random() * 0.9,
  });
  addEventListener("resize", () => fit(document.getElementById("sky")));
  (function tick(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    stars.forEach(st => {
      const tw = reduced ? st.a : st.a * (0.5 + 0.5 * Math.sin(t * 0.001 * st.s + st.p));
      ctx.fillStyle = "rgba(255,236,226," + tw + ")";
      ctx.beginPath(); ctx.arc(st.x * innerWidth, st.y * innerHeight, st.r, 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(tick);
  })(0);
})();

(function bokeh() {
  const cvs = document.getElementById("bokeh");
  const ctx = fit(cvs);
  const orbs = [];
  for (let k = 0; k < 18; k++) orbs.push({
    x: Math.random(), y: Math.random(),
    r: 18 + Math.random() * 50,
    a: 0.04 + Math.random() * 0.07,
    p: Math.random() * Math.PI * 2,
    s: 0.15 + Math.random() * 0.25,
    c: Math.random() > 0.4 ? "255,130,150" : "200,160,220",
  });
  addEventListener("resize", () => fit(cvs));
  (function tick(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    orbs.forEach(o => {
      const x = (o.x + Math.sin(t * 0.00015 * o.s + o.p) * 0.03) * innerWidth;
      const y = (o.y + Math.cos(t * 0.00012 * o.s + o.p) * 0.02) * innerHeight;
      const g = ctx.createRadialGradient(x, y, 0, x, y, o.r);
      g.addColorStop(0, "rgba(" + o.c + "," + o.a + ")");
      g.addColorStop(1, "rgba(" + o.c + ",0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, o.r, 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(tick);
  })(0);
})();

const fw = document.getElementById("fireworks");
const fctx = fit(fw);
addEventListener("resize", () => fit(fw));
const PALETTE = [[255,140,165],[255,200,210],[255,240,230],[220,180,255],[255,255,255]];
const rockets = [], sparks = [];

function launch(festive) {
  rockets.push({
    x: innerWidth * (0.12 + Math.random() * 0.76),
    y: innerHeight + 8,
    vx: (Math.random() - 0.5) * 0.9,
    vy: festive ? -8.5 : -7.3 - Math.random(),
    peak: innerHeight * (0.14 + Math.random() * 0.26),
    color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
    festive,
  });
}
function burst(x, y, color, festive) {
  const n = festive ? 76 : 52;
  for (let k = 0; k < n; k++) {
    const a = (Math.PI * 2 * k) / n + Math.random() * 0.2;
    const sp = (festive ? 3.3 : 2.5) + Math.random() * (festive ? 2.5 : 1.6);
    sparks.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1, decay: 0.01 + Math.random() * 0.008,
      color, r: festive ? 2.5 : 2,
    });
  }
}
function celebrate(count) {
  if (reduced) return;
  for (let k = 0; k < (count || 3); k++) setTimeout(() => launch(true), k * 240);
}

(function loop() {
  let last = 0;
  function tick(t) {
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    const gap = i === pages.length - 1 ? 1500 : 2300;
    if (!reduced && t - last > gap + Math.random() * 800) {
      last = t;
      launch(i === pages.length - 1);
    }
    fctx.globalCompositeOperation = "lighter";
    for (let k = rockets.length - 1; k >= 0; k--) {
      const r = rockets[k];
      r.x += r.vx; r.y += r.vy; r.vy += 0.065;
      fctx.shadowBlur = 14;
      fctx.shadowColor = "rgba(" + r.color.join(",") + ",1)";
      fctx.fillStyle = "rgb(" + r.color.join(",") + ")";
      fctx.beginPath(); fctx.arc(r.x, r.y, 2.3, 0, Math.PI * 2); fctx.fill();
      if (r.y <= r.peak || r.vy >= -0.2) { burst(r.x, r.y, r.color, r.festive); rockets.splice(k, 1); }
    }
    for (let k = sparks.length - 1; k >= 0; k--) {
      const p = sparks[k];
      p.x += p.vx; p.y += p.vy; p.vy += 0.022; p.vx *= 0.99; p.life -= p.decay;
      if (p.life <= 0) { sparks.splice(k, 1); continue; }
      fctx.shadowBlur = 18;
      fctx.shadowColor = "rgba(" + p.color.join(",") + ",1)";
      fctx.fillStyle = "rgba(" + p.color.join(",") + "," + (0.4 + p.life * 0.6) + ")";
      fctx.beginPath(); fctx.arc(p.x, p.y, p.r * (0.4 + p.life * 0.6), 0, Math.PI * 2); fctx.fill();
    }
    fctx.shadowBlur = 0;
    fctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

celebrate(3);
</script>
</body>
</html>
