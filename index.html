<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Qixi · Date with cc</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0b10;
    --text: #f4f1ea;
    --muted: #9a948b;
    --rose: #ff6b8a;
    --rose-soft: #ff8fa3;
    --card: rgba(22, 22, 28, 0.72);
    --line: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: "Manrope", "Noto Sans SC", "PingFang SC", sans-serif;
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background:
      radial-gradient(ellipse 70% 45% at 80% 0%, rgba(255, 107, 138, 0.16), transparent 55%),
      radial-gradient(ellipse 50% 40% at 10% 90%, rgba(120, 90, 220, 0.12), transparent 50%),
      linear-gradient(180deg, #0a0b10 0%, #12131a 100%);
  }

  canvas#sky, canvas#fireworks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  canvas#fireworks { z-index: 1; }

  .stage { position: relative; z-index: 2; width: 100%; max-width: 420px; }

  .card {
    background: var(--card);
    backdrop-filter: blur(22px) saturate(1.2);
    -webkit-backdrop-filter: blur(22px) saturate(1.2);
    border-radius: 28px;
    padding: 32px 24px 28px;
    border: 1px solid var(--line);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    text-align: center;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 11px 5px 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-bottom: 18px;
  }
  .chip i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--rose);
    box-shadow: 0 0 10px rgba(255, 107, 138, 0.7);
  }

  .screen { display: none; animation: up 0.42s ease; }
  .screen.active { display: block; }
  @keyframes up {
    from { transform: translateY(8px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }

  .hero {
    width: 64px;
    height: 64px;
    margin: 4px auto 10px;
    border-radius: 20px;
    display: grid;
    place-items: center;
    font-size: 30px;
    background: linear-gradient(160deg, rgba(255, 107, 138, 0.22), rgba(255, 255, 255, 0.04));
    border: 1px solid rgba(255, 143, 163, 0.2);
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.45;
    margin: 8px 0 8px;
    letter-spacing: -0.02em;
  }
  .sub {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 24px;
    min-height: 20px;
    line-height: 1.55;
  }

  .btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    min-height: 64px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    font-weight: 650;
    transition: transform 0.16s ease, opacity 0.2s ease, box-shadow 0.2s ease;
  }
  button:active { transform: scale(0.96); }

  .btn-yes {
    background: var(--rose);
    color: #fff;
    border-radius: 999px;
    padding: 13px 26px;
    font-size: 16px;
    box-shadow: 0 10px 24px rgba(255, 107, 138, 0.32);
  }
  .btn-no {
    background: rgba(255, 255, 255, 0.04);
    color: var(--muted);
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 15px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .field { text-align: left; margin: 0 0 18px; }
  .field > label {
    display: block;
    font-size: 13px;
    font-weight: 650;
    margin: 0 0 10px;
    color: #d8d2c8;
  }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    padding: 12px 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .opt .oemoji { font-size: 20px; }
  .opt.selected {
    border-color: rgba(255, 107, 138, 0.55);
    background: rgba(255, 107, 138, 0.12);
  }

  input[type="text"], input[type="datetime-local"], textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 12px 13px;
    background: rgba(255, 255, 255, 0.04);
    outline: none;
    color-scheme: dark;
  }
  input:focus, textarea:focus { border-color: rgba(255, 107, 138, 0.55); }
  textarea { resize: none; min-height: 64px; }
  .custom-wrap { margin-top: 8px; display: none; }
  .custom-wrap.show { display: block; }
  .hint { font-size: 12px; color: var(--rose-soft); margin: 6px 2px 0; min-height: 16px; }

  .summary {
    text-align: left;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 18px;
    padding: 14px 16px;
    margin: 6px 0 20px;
  }
  .summary .row { display: flex; gap: 10px; padding: 7px 0; font-size: 14px; color: var(--muted); }
  .summary .row b { color: var(--text); font-weight: 650; }

  .stack { display: flex; flex-direction: column; gap: 10px; }
  .btn-wide {
    width: 100%;
    padding: 13px;
    font-size: 15px;
    border-radius: 999px;
    background: var(--rose);
    color: #fff;
    box-shadow: 0 10px 22px rgba(255, 107, 138, 0.28);
  }
  .btn-ghost {
    width: 100%;
    padding: 12px;
    font-size: 14px;
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: #1a1b22;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 11px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.28s ease;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .footnote {
    margin-top: 18px;
    font-size: 12px;
    color: #6f6a64;
  }

  @media (max-width: 380px) {
    h1 { font-size: 20px; }
    .card { padding: 28px 18px 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .screen { animation: none; }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<canvas id="fireworks"></canvas>

<div class="stage">
  <div class="card">
    <div class="chip"><i></i> Qixi · 08.19</div>

    <section class="screen active" id="screen-ask">
      <div class="hero" id="askEmoji">💗</div>
      <h1 id="askTitle">cc，七夕晚上出来约会吗？</h1>
      <p class="sub" id="askSub">今天这种日子，当然要约你。</p>
      <div class="btns" id="askBtns">
        <button class="btn-yes" id="btnYes">好呀</button>
        <button class="btn-no" id="btnNo">再想想</button>
      </div>
    </section>

    <section class="screen" id="screen-details">
      <div class="hero">✨</div>
      <h1>太好了，那我们安排一下</h1>
      <p class="sub">告诉我 cc 今晚想怎么过</p>

      <div class="field">
        <label>想去哪吃</label>
        <div class="options" id="restaurantOptions"></div>
        <div class="custom-wrap" id="customWrap">
          <input type="text" id="customRestaurant" placeholder="写下你想去的地方" maxlength="40" />
        </div>
      </div>

      <div class="field">
        <label>什么时候来接你</label>
        <input type="datetime-local" id="pickupTime" />
      </div>

      <div class="field" style="margin-bottom:8px;">
        <label>想对我说的（可选）</label>
        <textarea id="message" placeholder="比如：记得带花" maxlength="120"></textarea>
      </div>

      <p class="hint" id="detailsHint"></p>
      <button class="btn-wide" id="btnConfirm" style="margin-top:8px;">就这么定了</button>
    </section>

    <section class="screen" id="screen-done">
      <div class="hero">🎉</div>
      <h1 id="doneTitle">约会锁定了</h1>
      <p class="sub" id="doneSub">这是我和 cc 的七夕计划</p>

      <div class="summary" id="summaryCard"></div>

      <div class="stack" id="doneActions">
        <button class="btn-wide" id="btnCopy">复制，发给他</button>
        <button class="btn-ghost" id="btnShare">生成分享链接</button>
      </div>

      <p class="footnote">made for cc</p>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  askTitle: "cc，七夕晚上出来约会吗？",
  askSub: "今天这种日子，当然要约你。",
  persuasions: [
    { mark: "🥺", title: "诶，cc 再想想嘛，拒绝我会有点伤心" },
    { mark: "🙈", title: "这个答案我不接受，再选一次" },
    { mark: "🍜", title: "我都想好带你去吃什么了，真的不来？" },
    { mark: "😤", title: "那个按钮有点危险，建议别点" },
    { mark: "🌷", title: "就当给我一个面子嘛，cc" },
    { mark: "🌙", title: "今晚烟花都准备好了，就差你" },
    { mark: "🎁", title: "我给 cc 准备了小惊喜，选「好」才能看" },
    { mark: "🥹", title: "一年就这一天，cc 答应我好不好" },
    { mark: "💗", title: "好啦，点这个大大的「好」就行" },
  ],
  restaurants: [
    { emoji: "🍲", name: "火锅" },
    { emoji: "🍣", name: "日料" },
    { emoji: "🍝", name: "西餐" },
    { emoji: "🍢", name: "烧烤" },
    { emoji: "🥘", name: "家常小炒" },
    { emoji: "✏️", name: "其他", custom: true },
  ],
};

const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

(function drawSky() {
  const cvs = document.getElementById("sky");
  const ctx = cvs.getContext("2d");
  const stars = [];
  function resize() {
    cvs.width = window.innerWidth * devicePixelRatio;
    cvs.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);
  const n = Math.min(70, Math.floor(window.innerWidth * 0.07));
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random(), y: Math.random() * 0.8,
      r: Math.random() * 1.05 + 0.2,
      a: 0.12 + Math.random() * 0.45,
      p: Math.random() * Math.PI * 2,
      s: 0.4 + Math.random() * 0.8,
    });
  }
  function tick(t) {
    const w = window.innerWidth, h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    stars.forEach(st => {
      const tw = reduced ? st.a : st.a * (0.55 + 0.45 * Math.sin(t * 0.001 * st.s + st.p));
      ctx.fillStyle = "rgba(255,245,238," + tw + ")";
      ctx.beginPath();
      ctx.arc(st.x * w, st.y * h, st.r, 0, Math.PI * 2);
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

const fw = document.getElementById("fireworks");
const fctx = fw.getContext("2d");
function sizeFw() {
  fw.width = window.innerWidth * devicePixelRatio;
  fw.height = window.innerHeight * devicePixelRatio;
  fctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
sizeFw();
window.addEventListener("resize", sizeFw);

const PALETTE = [
  [255, 107, 138],
  [255, 176, 190],
  [255, 230, 220],
  [196, 164, 255],
  [255, 255, 255],
];

const rockets = [];
const sparks = [];

function launch(x, y, festive) {
  const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
  rockets.push({
    x, y, vx: (Math.random() - 0.5) * 0.35,
    vy: festive ? -7.2 : -6.1 - Math.random() * 1.1,
    color, festive,
  });
}

function burst(x, y, color, festive) {
  const n = festive ? 44 : 28;
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i) / n + Math.random() * 0.18;
    const sp = (festive ? 2.3 : 1.6) + Math.random() * (festive ? 1.7 : 1.15);
    sparks.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1, decay: 0.013 + Math.random() * 0.01,
      color, r: festive ? 1.5 : 1.15,
    });
  }
}

function celebrate() {
  if (reduced) return;
  const w = window.innerWidth, h = window.innerHeight;
  launch(w * 0.3, h * 0.42, true);
  setTimeout(() => launch(w * 0.7, h * 0.36, true), 220);
  setTimeout(() => launch(w * 0.5, h * 0.3, true), 460);
}

(function loopFw() {
  let lastAmbient = 0;
  function tick(t) {
    const w = window.innerWidth, h = window.innerHeight;
    fctx.clearRect(0, 0, w, h);
    if (!reduced && t - lastAmbient > 5400 + Math.random() * 2400 && rockets.length < 2) {
      lastAmbient = t;
      launch(w * (0.18 + Math.random() * 0.64), h * (0.22 + Math.random() * 0.28), false);
    }
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.055;
      fctx.fillStyle = "rgba(" + r.color.join(",") + ",0.9)";
      fctx.beginPath(); fctx.arc(r.x, r.y, 1.5, 0, Math.PI * 2); fctx.fill();
      if (r.vy >= -0.35) {
        burst(r.x, r.y, r.color, r.festive);
        rockets.splice(i, 1);
      }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.018; p.vx *= 0.992; p.life -= p.decay;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      fctx.fillStyle = "rgba(" + p.color.join(",") + "," + (p.life * 0.7) + ")";
      fctx.beginPath(); fctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); fctx.fill();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

const btnYes = document.getElementById("btnYes");
const btnNo = document.getElementById("btnNo");
const askTitle = document.getElementById("askTitle");
const askSub = document.getElementById("askSub");
const askEmoji = document.getElementById("askEmoji");

let noCount = 0;
let yesScale = 1;

function escalate() {
  const p = CONFIG.persuasions[Math.min(noCount, CONFIG.persuasions.length - 1)];
  askEmoji.textContent = p.mark;
  askTitle.textContent = p.title;
  askSub.textContent = "";
  yesScale = Math.min(yesScale + 0.14, 1.85);
  btnYes.style.transform = "scale(" + yesScale + ")";
  btnYes.style.margin = 6 + yesScale * 3 + "px";
  const shrink = Math.max(1 - noCount * 0.12, 0.35);
  btnNo.style.fontSize = 15 * shrink + "px";
  btnNo.style.padding = (12 * shrink) + "px " + (20 * shrink) + "px";
  btnNo.style.opacity = Math.max(1 - noCount * 0.09, 0.35);
  noCount++;
  if (noCount >= 3) enableDodge();
}

let dodging = false;
function enableDodge() {
  if (dodging) return;
  dodging = true;
  btnNo.style.position = "fixed";
  btnNo.style.zIndex = "45";
  moveNoRandom();
  btnNo.addEventListener("mouseover", moveNoRandom);
  btnNo.addEventListener("touchstart", function (e) { e.preventDefault(); moveNoRandom(); }, { passive: false });
}
function moveNoRandom() {
  const bw = btnNo.offsetWidth || 80;
  const bh = btnNo.offsetHeight || 40;
  const maxX = Math.max(window.innerWidth - bw - 16, 16);
  const maxY = Math.max(window.innerHeight - bh - 16, 16);
  btnNo.style.left = (16 + Math.random() * (maxX - 16)) + "px";
  btnNo.style.top = (16 + Math.random() * (maxY - 16)) + "px";
}

btnNo.addEventListener("click", escalate);
btnYes.addEventListener("click", function () {
  dodging = true;
  btnNo.style.display = "none";
  celebrate();
  setTimeout(() => showScreen("screen-details"), 700);
  initDefaultTime();
});

const restaurantOptions = document.getElementById("restaurantOptions");
const customWrap = document.getElementById("customWrap");
const customRestaurant = document.getElementById("customRestaurant");
const pickupTime = document.getElementById("pickupTime");
const messageEl = document.getElementById("message");
const detailsHint = document.getElementById("detailsHint");

let selectedRestaurant = null;
let isCustom = false;

CONFIG.restaurants.forEach((r) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "opt";
  b.innerHTML = '<span class="oemoji">' + r.emoji + '</span><span>' + r.name + '</span>';
  b.addEventListener("click", () => {
    document.querySelectorAll(".opt").forEach(o => o.classList.remove("selected"));
    b.classList.add("selected");
    isCustom = !!r.custom;
    selectedRestaurant = r.custom ? "" : r.name;
    customWrap.classList.toggle("show", isCustom);
    if (isCustom) customRestaurant.focus();
    detailsHint.textContent = "";
  });
  restaurantOptions.appendChild(b);
});

function initDefaultTime() {
  const d = new Date();
  d.setHours(19, 0, 0, 0);
  if (d.getTime() < Date.now()) d.setDate(d.getDate() + 1);
  const pad = n => String(n).padStart(2, "0");
  pickupTime.value = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" +
    pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function getRestaurantValue() {
  if (isCustom) return customRestaurant.value.trim();
  return selectedRestaurant;
}

document.getElementById("btnConfirm").addEventListener("click", () => {
  const rest = getRestaurantValue();
  if (!rest) {
    detailsHint.textContent = isCustom ? "写下你想去的地方" : "先选一个想去的地方";
    return;
  }
  if (!pickupTime.value) {
    detailsHint.textContent = "还没选接你的时间";
    return;
  }
  renderSummary({ r: rest, t: pickupTime.value, m: messageEl.value.trim() });
  showScreen("screen-done");
  setTimeout(celebrate, 180);
});

function prettyTime(v) {
  if (!v) return "";
  const d = new Date(v);
  if (isNaN(d)) return v;
  const week = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  const pad = n => String(n).padStart(2, "0");
  return (d.getMonth() + 1) + "月" + d.getDate() + "日（" + week + "） " +
    pad(d.getHours()) + ":" + pad(d.getMinutes());
}

let currentResult = null;
function renderSummary(data) {
  currentResult = data;
  const card = document.getElementById("summaryCard");
  let html = "";
  html += '<div class="row"><span>🍽</span><span>想吃的：<b>' + escapeHtml(data.r) + '</b></span></div>';
  html += '<div class="row"><span>⏰</span><span>接她时间：<b>' + escapeHtml(prettyTime(data.t)) + '</b></span></div>';
  if (data.m) html += '<div class="row"><span>💬</span><span>留言：<b>' + escapeHtml(data.m) + '</b></span></div>';
  card.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
  ));
}

function buildText(data) {
  let t = "七夕约会锁定了 💗\n\n";
  t += "想吃的：" + data.r + "\n";
  t += "接我的时间：" + prettyTime(data.t) + "\n";
  if (data.m) t += "留言：" + data.m + "\n";
  t += "\n说好了，不许反悔。";
  return t;
}

function buildShareLink(data) {
  const base = location.origin + location.pathname;
  const q = new URLSearchParams({ r: data.r, t: data.t, m: data.m || "" });
  return base + "?" + q.toString();
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2200);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) {}
    document.body.removeChild(ta);
    return ok;
  }
}

document.getElementById("btnCopy").addEventListener("click", async () => {
  if (!currentResult) return;
  const ok = await copyText(buildText(currentResult));
  toast(ok ? "已复制，快去发给他吧" : "复制失败，长按选择文字试试");
});

document.getElementById("btnShare").addEventListener("click", async () => {
  if (!currentResult) return;
  const link = buildShareLink(currentResult);
  if (navigator.share) {
    try {
      await navigator.share({ title: "七夕约会", text: buildText(currentResult), url: link });
      return;
    } catch (e) { /* cancelled */ }
  }
  const ok = await copyText(link);
  toast(ok ? "链接已复制，发给他就能看到" : "复制失败了");
});

(function checkIncomingResult() {
  const q = new URLSearchParams(location.search);
  if (!q.has("r") || !q.has("t")) return;
  const data = { r: q.get("r") || "", t: q.get("t") || "", m: q.get("m") || "" };
  document.getElementById("doneTitle").textContent = "cc 答应啦";
  document.getElementById("doneSub").textContent = "这是 cc 选好的七夕计划";
  renderSummary(data);
  const actions = document.getElementById("doneActions");
  actions.innerHTML = "";
  const calBtn = document.createElement("button");
  calBtn.className = "btn-wide";
  calBtn.textContent = "加入日历";
  calBtn.addEventListener("click", () => downloadICS(data));
  actions.appendChild(calBtn);
  const againBtn = document.createElement("button");
  againBtn.className = "btn-ghost";
  againBtn.textContent = "我也来发一个";
  againBtn.addEventListener("click", () => { location.href = location.origin + location.pathname; });
  actions.appendChild(againBtn);
  showScreen("screen-done");
  setTimeout(celebrate, 250);
})();

function downloadICS(data) {
  const start = new Date(data.t);
  if (isNaN(start)) { toast("时间格式看不懂"); return; }
  const end = new Date(start.getTime() + 2 * 60 * 60 * 1000);
  const fmt = d => d.getFullYear() +
    String(d.getMonth() + 1).padStart(2, "0") +
    String(d.getDate()).padStart(2, "0") + "T" +
    String(d.getHours()).padStart(2, "0") +
    String(d.getMinutes()).padStart(2, "0") + "00";
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//date-invite//CN",
    "BEGIN:VEVENT",
    "DTSTART:" + fmt(start),
    "DTEND:" + fmt(end),
    "SUMMARY:七夕约会 · " + data.r,
    "DESCRIPTION:" + (data.m ? data.m.replace(/\n/g, " ") : "和 cc 的七夕约会"),
    "END:VEVENT", "END:VCALENDAR",
  ].join("\r\n");
  const blob = new Blob([ics], { type: "text/calendar" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "qixi-date.ics";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("已生成日历文件");
}

askTitle.textContent = CONFIG.askTitle;
askSub.textContent = CONFIG.askSub;
