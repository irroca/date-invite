<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>要和我约会吗？ 💕</title>
<style>
  /* ============================================================
     可自定义区：改这里就能改称呼 / 话术 / 餐厅 / 配色
     JS 里的 CONFIG 也可以改，见文件底部
     ============================================================ */
  :root {
    --cream: #fff7f0;
    --pink: #ffb6c9;
    --pink-deep: #ff7fa3;
    --mint: #b8ecd8;
    --yellow: #ffe6a3;
    --lav: #d9c7ff;
    --ink: #6b5a67;
    --card: #fffdfb;
    --shadow: 0 18px 40px rgba(255, 127, 163, 0.25);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; margin: 0; }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
      "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, #ffe1ec 0%, #fff2e0 35%, #e2fbef 70%, #eee3ff 100%);
    background-size: 400% 400%;
    animation: bgShift 18s ease infinite;
    min-height: 100dvh;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* 漂浮的爱心 / 小动物 */
  .floaties { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .floaty {
    position: absolute;
    bottom: -60px;
    font-size: 28px;
    opacity: 0.8;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06));
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.85; }
    90%  { opacity: 0.85; }
    100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
  }

  .stage { position: relative; z-index: 1; width: 100%; max-width: 460px; }

  .card {
    background: var(--card);
    border-radius: 32px;
    padding: 38px 26px 34px;
    box-shadow: var(--shadow);
    border: 3px solid #fff;
    text-align: center;
    position: relative;
  }

  .screen { display: none; animation: pop 0.5s cubic-bezier(.2,.9,.3,1.4); }
  .screen.active { display: block; }
  @keyframes pop {
    from { transform: scale(0.85) translateY(14px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }

  .emoji-hero {
    font-size: 64px;
    display: inline-block;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50%     { transform: translateY(-10px) rotate(4deg); }
  }

  h1 {
    font-size: 26px;
    margin: 14px 0 6px;
    line-height: 1.4;
    color: var(--pink-deep);
    letter-spacing: 0.5px;
  }
  .sub { font-size: 15px; color: var(--ink); opacity: 0.75; margin: 0 0 24px; min-height: 22px; }

  /* 按钮 */
  .btns { position: relative; display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap; min-height: 70px; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 999px;
    font-weight: 700;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.2s ease;
  }
  button:active { transform: scale(0.94); }

  .btn-yes {
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    color: #fff;
    padding: 16px 34px;
    font-size: 18px;
    box-shadow: 0 10px 22px rgba(255,127,163,0.45);
  }
  .btn-yes:hover { transform: translateY(-2px) scale(1.03); }

  .btn-no {
    background: #fff;
    color: var(--ink);
    padding: 14px 26px;
    font-size: 16px;
    border: 2px solid #ffd9e2;
    box-shadow: 0 6px 14px rgba(0,0,0,0.06);
  }

  /* 详情页表单 */
  .field { text-align: left; margin: 0 0 20px; }
  .field > label { display: block; font-weight: 700; font-size: 15px; margin: 0 0 10px; color: var(--pink-deep); }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt {
    background: #fff;
    border: 2px solid #ffe0e8;
    border-radius: 18px;
    padding: 12px 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: all 0.15s ease;
  }
  .opt .oemoji { font-size: 24px; }
  .opt.selected {
    border-color: var(--pink-deep);
    background: linear-gradient(135deg, #fff0f4, #ffe3ec);
    box-shadow: 0 6px 14px rgba(255,127,163,0.28);
    transform: translateY(-2px);
  }

  input[type="text"], input[type="datetime-local"], textarea {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    border: 2px solid #ffe0e8;
    border-radius: 16px;
    padding: 12px 14px;
    background: #fffdfd;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input:focus, textarea:focus { border-color: var(--pink-deep); }
  textarea { resize: none; min-height: 64px; }
  .custom-wrap { margin-top: 10px; display: none; }
  .custom-wrap.show { display: block; }

  .hint { font-size: 12.5px; color: #c99; margin: 6px 2px 0; min-height: 16px; }

  /* 总结卡片 */
  .summary {
    text-align: left;
    background: linear-gradient(135deg, #fff6f9, #f3fff9);
    border: 2px dashed #ffc4d6;
    border-radius: 22px;
    padding: 18px 20px;
    margin: 8px 0 20px;
  }
  .summary .row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-size: 15px; }
  .summary .row .k { font-size: 20px; }
  .summary .row .v { flex: 1; }
  .summary .row .v b { color: var(--pink-deep); }

  .stack { display: flex; flex-direction: column; gap: 12px; }
  .btn-wide {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    color: #fff;
    box-shadow: 0 8px 18px rgba(255,127,163,0.4);
  }
  .btn-ghost {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    background: #fff;
    color: var(--pink-deep);
    border: 2px solid #ffd0dd;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%) translateY(24px);
    background: rgba(107,90,103,0.95);
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 50;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .footnote { margin-top: 18px; font-size: 12px; color: #cbb; }

  canvas#confetti {
    position: fixed; inset: 0; pointer-events: none; z-index: 40;
  }

  @media (max-width: 380px) {
    h1 { font-size: 23px; }
    .card { padding: 32px 20px 28px; }
  }
</style>
</head>
<body>

<div class="floaties" id="floaties"></div>
<canvas id="confetti"></canvas>

<div class="stage">
  <div class="card">

    <!-- 开场页 -->
    <section class="screen active" id="screen-ask">
      <span class="emoji-hero" id="askEmoji">🐻</span>
      <h1 id="askTitle">亲爱的，可以赏脸和我约个会吗？</h1>
      <p class="sub" id="askSub">（这是一个很重要的邀请哦~）</p>
      <div class="btns" id="askBtns">
        <button class="btn-yes" id="btnYes">好呀好呀 💕</button>
        <button class="btn-no" id="btnNo">再想想…</button>
      </div>
    </section>

    <!-- 详情页 -->
    <section class="screen" id="screen-details">
      <span class="emoji-hero">🎀</span>
      <h1>太好啦！那我们来安排一下~</h1>
      <p class="sub">告诉我你的小心愿吧 ✨</p>

      <div class="field">
        <label>🍽️ 想去哪里吃呀？</label>
        <div class="options" id="restaurantOptions"></div>
        <div class="custom-wrap" id="customWrap">
          <input type="text" id="customRestaurant" placeholder="偷偷写下你想去的地方~" maxlength="40" />
        </div>
      </div>

      <div class="field">
        <label>⏰ 什么时候来接你？</label>
        <input type="datetime-local" id="pickupTime" />
      </div>

      <div class="field" style="margin-bottom:8px;">
        <label>💌 想对我说的悄悄话（可选）</label>
        <textarea id="message" placeholder="写点什么呀~ 比如“记得给我带花花🌷”" maxlength="120"></textarea>
      </div>

      <p class="hint" id="detailsHint"></p>
      <button class="btn-wide" id="btnConfirm" style="margin-top:8px;">就这么定啦！ 🥰</button>
    </section>

    <!-- 确认 / 结果页 -->
    <section class="screen" id="screen-done">
      <span class="emoji-hero">💝</span>
      <h1 id="doneTitle">约会预定成功！</h1>
      <p class="sub" id="doneSub">这是我们的小约定~</p>

      <div class="summary" id="summaryCard"></div>

      <div class="stack" id="doneActions">
        <button class="btn-wide" id="btnCopy">📋 一键复制，发给他看~</button>
        <button class="btn-ghost" id="btnShare">🔗 生成分享链接</button>
      </div>

      <p class="footnote">用 💕 为你定制</p>
    </section>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG —— 想改内容改这里就好
   ============================================================ */
const CONFIG = {
  // 开场标题（首次显示）
  askTitle: "亲爱的，可以赏脸和我约个会吗？",
  askSub: "（这是一个很重要的邀请哦~）",

  // 点“不要”时循环切换的俏皮话术 + 对应表情
  persuasions: [
    { emoji: "🥺", title: "诶？再想想嘛~ 拒绝我可是会伤心的哦" },
    { emoji: "🙈", title: "不行不行，这个答案我不接受，再选一次！" },
    { emoji: "🍰", title: "我已经想好带你去吃好吃的啦，真的不来？" },
    { emoji: "🐰", title: "哼，不许点那个按钮！它会咬人的！" },
    { emoji: "🌷", title: "就当赏我一个面子嘛，好不好嘛~" },
    { emoji: "😽", title: "你看，连小猫都在求你答应了呀" },
    { emoji: "💐", title: "我准备了小惊喜哦，选“好”才能看到~" },
    { emoji: "🥹", title: "最后一次机会啦，答应我好不好？" },
    { emoji: "💖", title: "好啦好啦，那个键别点了，点这个大大的“好”嘛！" },
  ],

  // 餐厅候选（emoji + 名称，随便改）
  restaurants: [
    { emoji: "🍲", name: "火锅" },
    { emoji: "🍣", name: "日料" },
    { emoji: "🍝", name: "西餐" },
    { emoji: "🍢", name: "烧烤" },
    { emoji: "🥘", name: "家常小炒" },
    { emoji: "✏️", name: "其他", custom: true },
  ],
};

/* ============================================================
   漂浮小装饰
   ============================================================ */
(function spawnFloaties() {
  const set = ["💕","🐻","🐰","🍰","🌷","💖","🎀","🧸","🌸","✨"];
  const wrap = document.getElementById("floaties");
  const N = 14;
  for (let i = 0; i < N; i++) {
    const s = document.createElement("span");
    s.className = "floaty";
    s.textContent = set[Math.floor(Math.random() * set.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = 18 + Math.random() * 26 + "px";
    const dur = 10 + Math.random() * 12;
    s.style.animationDuration = dur + "s";
    s.style.animationDelay = -Math.random() * dur + "s";
    wrap.appendChild(s);
  }
})();

/* ============================================================
   屏幕切换
   ============================================================ */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ============================================================
   开场页：要 / 不要 挽留机制
   ============================================================ */
const btnYes = document.getElementById("btnYes");
const btnNo = document.getElementById("btnNo");
const askTitle = document.getElementById("askTitle");
const askSub = document.getElementById("askSub");
const askEmoji = document.getElementById("askEmoji");
const askBtns = document.getElementById("askBtns");

let noCount = 0;
let yesScale = 1;

function escalate() {
  const p = CONFIG.persuasions[Math.min(noCount, CONFIG.persuasions.length - 1)];
  askEmoji.textContent = p.emoji;
  askTitle.textContent = p.title;
  askSub.textContent = "";

  // “好”按钮越来越大
  yesScale = Math.min(yesScale + 0.16, 2.1);
  btnYes.style.transform = "scale(" + yesScale + ")";
  btnYes.style.margin = 6 + yesScale * 4 + "px";

  // “不要”按钮越来越小 + 变淡
  const shrink = Math.max(1 - noCount * 0.12, 0.35);
  btnNo.style.fontSize = 16 * shrink + "px";
  btnNo.style.padding = (14 * shrink) + "px " + (26 * shrink) + "px";
  btnNo.style.opacity = Math.max(1 - noCount * 0.09, 0.35);

  noCount++;

  // 从第 3 次起，“不要”开始躲闪
  if (noCount >= 3) enableDodge();
}

// 躲闪：让“不要”按钮 fixed 定位并随机跳位
let dodging = false;
function enableDodge() {
  if (dodging) return;
  dodging = true;
  btnNo.style.position = "fixed";
  btnNo.style.zIndex = "45";
  moveNoRandom();
  btnNo.addEventListener("mouseover", moveNoRandom);
  btnNo.addEventListener("touchstart", function (e) { e.preventDefault(); moveNoRandom(); }, { passive: false });
}
function moveNoRandom() {
  const bw = btnNo.offsetWidth || 80;
  const bh = btnNo.offsetHeight || 40;
  const maxX = Math.max(window.innerWidth - bw - 16, 16);
  const maxY = Math.max(window.innerHeight - bh - 16, 16);
  btnNo.style.left = (16 + Math.random() * (maxX - 16)) + "px";
  btnNo.style.top = (16 + Math.random() * (maxY - 16)) + "px";
}

btnNo.addEventListener("click", escalate);

btnYes.addEventListener("click", function () {
  // 恢复“不要”按钮不再乱跑
  dodging = true;
  btnNo.style.display = "none";
  celebrate();
  setTimeout(() => showScreen("screen-details"), 700);
  initDefaultTime();
});

/* ============================================================
   confetti / 爱心庆祝
   ============================================================ */
const cvs = document.getElementById("confetti");
const ctx = cvs.getContext("2d");
function sizeCanvas() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
sizeCanvas();
window.addEventListener("resize", sizeCanvas);

function celebrate() {
  const colors = ["#ff7fa3","#ffb6c9","#ffe6a3","#b8ecd8","#d9c7ff","#ffffff"];
  const emojis = ["💕","💖","🌸","✨","🎉","💝"];
  const parts = [];
  for (let i = 0; i < 140; i++) {
    parts.push({
      x: Math.random() * cvs.width,
      y: -20 - Math.random() * cvs.height * 0.4,
      vx: (Math.random() - 0.5) * 3,
      vy: 2 + Math.random() * 4,
      size: 6 + Math.random() * 8,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.2,
      color: colors[Math.floor(Math.random() * colors.length)],
      isEmoji: Math.random() < 0.28,
      emoji: emojis[Math.floor(Math.random() * emojis.length)],
    });
  }
  let frames = 0;
  (function anim() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if (p.isEmoji) {
        ctx.font = (p.size * 2.2) + "px serif";
        ctx.textAlign = "center";
        ctx.fillText(p.emoji, 0, 0);
      } else {
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      }
      ctx.restore();
    });
    frames++;
    if (frames < 220) requestAnimationFrame(anim);
    else ctx.clearRect(0, 0, cvs.width, cvs.height);
  })();
}

/* ============================================================
   详情页：餐厅 / 时间 / 留言
   ============================================================ */
const restaurantOptions = document.getElementById("restaurantOptions");
const customWrap = document.getElementById("customWrap");
const customRestaurant = document.getElementById("customRestaurant");
const pickupTime = document.getElementById("pickupTime");
const messageEl = document.getElementById("message");
const detailsHint = document.getElementById("detailsHint");

let selectedRestaurant = null;
let isCustom = false;

CONFIG.restaurants.forEach((r, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "opt";
  b.innerHTML = '<span class="oemoji">' + r.emoji + '</span><span>' + r.name + '</span>';
  b.addEventListener("click", () => {
    document.querySelectorAll(".opt").forEach(o => o.classList.remove("selected"));
    b.classList.add("selected");
    isCustom = !!r.custom;
    selectedRestaurant = r.custom ? "" : r.name;
    customWrap.classList.toggle("show", isCustom);
    if (isCustom) customRestaurant.focus();
    detailsHint.textContent = "";
  });
  restaurantOptions.appendChild(b);
});

function initDefaultTime() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  d.setHours(18, 30, 0, 0);
  const pad = n => String(n).padStart(2, "0");
  pickupTime.value = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" +
    pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function getRestaurantValue() {
  if (isCustom) return customRestaurant.value.trim();
  return selectedRestaurant;
}

document.getElementById("btnConfirm").addEventListener("click", () => {
  const rest = getRestaurantValue();
  if (!rest) {
    detailsHint.textContent = isCustom ? "悄悄写下你想去的地方呀~" : "先选一个想去的地方嘛 🍽️";
    return;
  }
  if (!pickupTime.value) {
    detailsHint.textContent = "还没选接你的时间哦 ⏰";
    return;
  }
  renderSummary({
    r: rest,
    t: pickupTime.value,
    m: messageEl.value.trim(),
  });
  showScreen("screen-done");
  setTimeout(celebrate, 150);
});

/* ============================================================
   结果页：总结卡片 / 复制 / 分享链接
   ============================================================ */
function prettyTime(v) {
  if (!v) return "";
  const d = new Date(v);
  if (isNaN(d)) return v;
  const week = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  const pad = n => String(n).padStart(2, "0");
  return (d.getMonth() + 1) + "月" + d.getDate() + "日（" + week + "） " +
    pad(d.getHours()) + ":" + pad(d.getMinutes());
}

let currentResult = null;
function renderSummary(data) {
  currentResult = data;
  const card = document.getElementById("summaryCard");
  let html = "";
  html += '<div class="row"><span class="k">🍽️</span><span class="v">想吃的：<b>' + escapeHtml(data.r) + '</b></span></div>';
  html += '<div class="row"><span class="k">⏰</span><span class="v">接她时间：<b>' + escapeHtml(prettyTime(data.t)) + '</b></span></div>';
  if (data.m) html += '<div class="row"><span class="k">💌</span><span class="v">悄悄话：<b>' + escapeHtml(data.m) + '</b></span></div>';
  card.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
  ));
}

function buildText(data) {
  let t = "💕 约会预定成功啦！\n\n";
  t += "🍽️ 想吃的：" + data.r + "\n";
  t += "⏰ 接我的时间：" + prettyTime(data.t) + "\n";
  if (data.m) t += "💌 悄悄话：" + data.m + "\n";
  t += "\n那就说好了哦，不许反悔~ 🥰";
  return t;
}

function buildShareLink(data) {
  const base = location.origin + location.pathname;
  const q = new URLSearchParams({ r: data.r, t: data.t, m: data.m || "" });
  return base + "?" + q.toString();
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2200);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) {}
    document.body.removeChild(ta);
    return ok;
  }
}

document.getElementById("btnCopy").addEventListener("click", async () => {
  if (!currentResult) return;
  const ok = await copyText(buildText(currentResult));
  toast(ok ? "已复制~ 快去发给他吧 💕" : "复制失败，长按选择文字试试");
});

document.getElementById("btnShare").addEventListener("click", async () => {
  if (!currentResult) return;
  const link = buildShareLink(currentResult);
  if (navigator.share) {
    try {
      await navigator.share({ title: "我们的小约定 💕", text: buildText(currentResult), url: link });
      return;
    } catch (e) { /* 用户取消则回退到复制 */ }
  }
  const ok = await copyText(link);
  toast(ok ? "链接已复制~ 发给他就能看到啦 🔗" : "复制失败了呜呜");
});

/* ============================================================
   如果 URL 带结果参数（她发回的链接）→ 直接显示“她的回复”
   ============================================================ */
(function checkIncomingResult() {
  const q = new URLSearchParams(location.search);
  if (!q.has("r") || !q.has("t")) return;
  const data = { r: q.get("r") || "", t: q.get("t") || "", m: q.get("m") || "" };

  document.getElementById("doneTitle").textContent = "她答应啦！💕";
  document.getElementById("doneSub").textContent = "这是她选好的小约定~";
  renderSummary(data);

  // 收件人视图：把按钮换成“加入日历 / 重新发起”
  const actions = document.getElementById("doneActions");
  actions.innerHTML = "";

  const calBtn = document.createElement("button");
  calBtn.className = "btn-wide";
  calBtn.textContent = "📅 加入我的日历";
  calBtn.addEventListener("click", () => downloadICS(data));
  actions.appendChild(calBtn);

  const againBtn = document.createElement("button");
  againBtn.className = "btn-ghost";
  againBtn.textContent = "💌 我也来发一个";
  againBtn.addEventListener("click", () => { location.href = location.origin + location.pathname; });
  actions.appendChild(againBtn);

  showScreen("screen-done");
  setTimeout(celebrate, 250);
})();

function downloadICS(data) {
  const start = new Date(data.t);
  if (isNaN(start)) { toast("时间格式看不懂呀~"); return; }
  const end = new Date(start.getTime() + 2 * 60 * 60 * 1000);
  const fmt = d => d.getFullYear() +
    String(d.getMonth() + 1).padStart(2, "0") +
    String(d.getDate()).padStart(2, "0") + "T" +
    String(d.getHours()).padStart(2, "0") +
    String(d.getMinutes()).padStart(2, "0") + "00";
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//date-invite//CN",
    "BEGIN:VEVENT",
    "DTSTART:" + fmt(start),
    "DTEND:" + fmt(end),
    "SUMMARY:和TA的约会 💕 - " + data.r,
    "DESCRIPTION:" + (data.m ? data.m.replace(/\n/g, " ") : "开心赴约~"),
    "END:VEVENT", "END:VCALENDAR",
  ].join("\r\n");
  const blob = new Blob([ics], { type: "text/calendar" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "date.ics";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("已生成日历文件~ 📅");
}

// 初始化开场文案（防止 CONFIG 被改动后不同步）
askTitle.textContent = CONFIG.askTitle;
askSub.textContent = CONFIG.askSub;
</script>
