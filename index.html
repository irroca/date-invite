<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Qixi · cc</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --text: #f6f1ea;
    --muted: #9a948b;
    --rose: #ff6b8a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: "Manrope", "Noto Sans SC", "PingFang SC", sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 70% 50% at 80% 0%, rgba(255,107,138,.18), transparent 55%),
      radial-gradient(ellipse 50% 40% at 10% 90%, rgba(120,90,220,.12), transparent 50%),
      #0a0b10;
  }

  canvas#sky, canvas#fireworks {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  canvas#sky { z-index: 0; }
  canvas#fireworks { z-index: 6; }

  .stage {
    position: relative; z-index: 2;
    height: 100dvh;
    display: grid;
    place-items: center;
    perspective: 1400px;
    padding: 20px;
  }

  .book {
    width: min(420px, 100%);
    height: min(620px, 78dvh);
    position: relative;
    transform-style: preserve-3d;
  }

  .page {
    position: absolute; inset: 0;
    border-radius: 28px;
    background: rgba(22,22,28,.72);
    backdrop-filter: blur(22px) saturate(1.2);
    -webkit-backdrop-filter: blur(22px) saturate(1.2);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 36px 28px;
    text-align: center;
    backface-visibility: hidden;
    transform-origin: left center;
    transform: rotateY(90deg);
    opacity: 0;
    pointer-events: none;
    transition: transform .7s cubic-bezier(.2,.8,.2,1), opacity .45s ease;
  }
  .page.done {
    transform: rotateY(-90deg);
    opacity: 0;
  }
  .page.now {
    transform: rotateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 12px 5px 7px; border-radius: 999px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
    color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: .06em;
    margin-bottom: 22px;
  }
  .chip i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--rose);
    box-shadow: 0 0 10px rgba(255,107,138,.7);
  }

  .orb {
    width: 88px; height: 88px; border-radius: 28px;
    display: grid; place-items: center; font-size: 40px;
    margin-bottom: 22px;
    background: linear-gradient(160deg, rgba(255,107,138,.28), rgba(255,255,255,.04));
    border: 1px solid rgba(255,143,163,.22);
    animation: float 4.5s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  h1 {
    font-size: clamp(36px, 10vw, 56px);
    font-weight: 800; letter-spacing: -.05em;
    line-height: 1.1; margin: 0 0 10px;
  }
  h1 em { font-style: normal; color: var(--rose); }
  .line {
    font-size: clamp(26px, 7vw, 38px);
    font-weight: 750; letter-spacing: -.03em; margin: 0;
    line-height: 1.35;
  }
  .soft { color: var(--muted); font-size: 15px; margin: 14px 0 0; line-height: 1.7; max-width: 16em; }

  .hint {
    position: absolute; bottom: 22px; left: 0; right: 0;
    color: #6c6760; font-size: 12px; letter-spacing: .08em;
  }

  .dots {
    position: fixed; z-index: 3; left: 50%; bottom: 18px;
    transform: translateX(-50%);
    display: flex; gap: 7px;
  }
  .dots b {
    width: 6px; height: 6px; border-radius: 99px;
    background: rgba(255,255,255,.22);
    transition: width .25s ease, background .25s ease;
  }
  .dots b.on { width: 18px; background: var(--rose); }

  .nav {
    position: fixed; z-index: 3; inset: 0;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; padding: 0 8px;
  }
  .nav button {
    pointer-events: auto;
    width: 40px; height: 40px; border: 0; border-radius: 50%;
    background: rgba(255,255,255,.06); color: #fff;
    font-size: 18px; cursor: pointer;
  }
  .nav button[disabled] { opacity: .2; }

  @media (prefers-reduced-motion: reduce) {
    .page { transition: none; }
    .orb { animation: none; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="fireworks"></canvas>

<div class="stage">
  <div class="book" id="book">
    <article class="page now" data-i="0">
      <div class="chip"><i></i> 08.19</div>
      <div class="orb">💗</div>
      <h1>给 <em>cc</em></h1>
      <p class="soft">把今晚的夜色，轻轻放在这里。</p>
      <div class="hint">向左滑 · 或点右边</div>
    </article>

    <article class="page" data-i="1">
      <div class="orb">✨</div>
      <p class="line">遇见你之后</p>
      <p class="soft">连晚风都变得温柔了一点。</p>
    </article>

    <article class="page" data-i="2">
      <div class="orb">🌙</div>
      <p class="line">想把这一年</p>
      <p class="soft">慢慢说给你听，一句也不急。</p>
    </article>

    <article class="page" data-i="3">
      <div class="orb">🎞</div>
      <p class="line">并肩走过的路</p>
      <p class="soft">那些普通的晚上，都算数。</p>
    </article>

    <article class="page" data-i="4">
      <div class="orb">🎆</div>
      <p class="line">七夕快乐</p>
      <p class="soft">余生也慢慢走，我很喜欢你。</p>
    </article>
  </div>
</div>

<div class="nav">
  <button id="prev" type="button" aria-label="上一页">‹</button>
  <button id="next" type="button" aria-label="下一页">›</button>
</div>
<div class="dots" id="dots"></div>

<script>
const pages = [...document.querySelectorAll(".page")];
const dots = document.getElementById("dots");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
let i = 0, lock = false;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

pages.forEach((_, n) => {
  const b = document.createElement("b");
  if (n === 0) b.className = "on";
  dots.appendChild(b);
});

function go(n) {
  if (lock || n === i || n < 0 || n >= pages.length) return;
  lock = true;
  const dir = n > i ? 1 : -1;
  pages[i].classList.remove("now");
  pages[i].classList.toggle("done", dir > 0);
  i = n;
  pages[i].classList.remove("done");
  pages[i].classList.add("now");
  dots.querySelectorAll("b").forEach((d, k) => d.classList.toggle("on", k === i));
  prev.disabled = i === 0;
  next.disabled = i === pages.length - 1;
  celebrate(i === pages.length - 1 ? 4 : 2);
  setTimeout(() => { lock = false; }, reduced ? 0 : 650);
}

prev.onclick = () => go(i - 1);
next.onclick = () => go(i + 1);
prev.disabled = true;

let x0 = null;
addEventListener("touchstart", e => { x0 = e.changedTouches[0].clientX; }, { passive: true });
addEventListener("touchend", e => {
  if (x0 == null) return;
  const dx = e.changedTouches[0].clientX - x0;
  x0 = null;
  if (Math.abs(dx) < 40) return;
  go(dx < 0 ? i + 1 : i - 1);
});
addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") go(i + 1);
  if (e.key === "ArrowLeft") go(i - 1);
});

(function sky() {
  const cvs = document.getElementById("sky"), ctx = cvs.getContext("2d"), stars = [];
  function size() {
    cvs.width = innerWidth * devicePixelRatio;
    cvs.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  size(); addEventListener("resize", size);
  const n = Math.min(70, Math.floor(innerWidth * .07));
  for (let k = 0; k < n; k++) stars.push({
    x: Math.random(), y: Math.random() * .85,
    r: Math.random() * 1.05 + .2, a: .12 + Math.random() * .45,
    p: Math.random() * Math.PI * 2, s: .4 + Math.random() * .8,
  });
  (function tick(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    stars.forEach(st => {
      const tw = reduced ? st.a : st.a * (.55 + .45 * Math.sin(t * .001 * st.s + st.p));
      ctx.fillStyle = "rgba(255,245,238," + tw + ")";
      ctx.beginPath(); ctx.arc(st.x * innerWidth, st.y * innerHeight, st.r, 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(tick);
  })(0);
})();

const fw = document.getElementById("fireworks"), fctx = fw.getContext("2d");
function sizeFw() {
  fw.width = innerWidth * devicePixelRatio;
  fw.height = innerHeight * devicePixelRatio;
  fctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
sizeFw(); addEventListener("resize", sizeFw);

const PALETTE = [[255,120,150],[255,190,200],[255,240,230],[210,180,255],[255,255,255]];
const rockets = [], sparks = [];

function launch(festive) {
  const x = innerWidth * (0.12 + Math.random() * 0.76);
  const peak = innerHeight * (0.16 + Math.random() * 0.28);
  rockets.push({
    x, y: innerHeight + 8,
    vx: (Math.random() - 0.5) * 0.9,
    vy: festive ? -8.4 : -7.2 - Math.random(),
    peak,
    color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
    festive,
  });
}

function burst(x, y, color, festive) {
  const n = festive ? 70 : 48;
  for (let k = 0; k < n; k++) {
    const a = (Math.PI * 2 * k) / n + Math.random() * 0.2;
    const sp = (festive ? 3.2 : 2.4) + Math.random() * (festive ? 2.4 : 1.6);
    sparks.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      decay: 0.01 + Math.random() * 0.008,
      color,
      r: festive ? 2.4 : 1.9,
    });
  }
}

function celebrate(count) {
  if (reduced) return;
  const n = count || 3;
  for (let k = 0; k < n; k++) setTimeout(() => launch(true), k * 240);
}

(function loop() {
  let last = 0;
  function tick(t) {
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    const gap = i === pages.length - 1 ? 1600 : 2400;
    if (!reduced && t - last > gap + Math.random() * 900) {
      last = t;
      launch(i === pages.length - 1);
    }
    fctx.globalCompositeOperation = "lighter";
    for (let k = rockets.length - 1; k >= 0; k--) {
      const r = rockets[k];
      r.x += r.vx; r.y += r.vy; r.vy += 0.065;
      fctx.shadowBlur = 12;
      fctx.shadowColor = "rgba(" + r.color.join(",") + ",1)";
      fctx.fillStyle = "rgba(" + r.color.join(",") + ",1)";
      fctx.beginPath(); fctx.arc(r.x, r.y, 2.2, 0, Math.PI * 2); fctx.fill();
      if (r.y <= r.peak || r.vy >= -0.2) {
        burst(r.x, r.y, r.color, r.festive);
        rockets.splice(k, 1);
      }
    }
    for (let k = sparks.length - 1; k >= 0; k--) {
      const p = sparks[k];
      p.x += p.vx; p.y += p.vy; p.vy += 0.022; p.vx *= 0.99; p.life -= p.decay;
      if (p.life <= 0) { sparks.splice(k, 1); continue; }
      fctx.shadowBlur = 16;
      fctx.shadowColor = "rgba(" + p.color.join(",") + ",1)";
      fctx.fillStyle = "rgba(" + p.color.join(",") + "," + (0.35 + p.life * 0.65) + ")";
      fctx.beginPath(); fctx.arc(p.x, p.y, p.r * (0.4 + p.life * 0.6), 0, Math.PI * 2); fctx.fill();
    }
    fctx.shadowBlur = 0;
    fctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

celebrate(3);
</script>
</body>
</html>
